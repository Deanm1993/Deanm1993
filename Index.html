<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Searchable Dropdown</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JotForm Custom Widget SDK -->
    <script src="https://js.jotform.com/JFCustomWidget.js"></script>
    <style>
        /* Simple styling for the dropdown items */
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 8px;
            background-color: #fff;
        }
        .item:hover {
            background-color: #f0f4ff;
        }
        .item.selected {
            background-color: #e0e7ff;
            font-weight: 500;
        }
        /* Hide scrollbar for Chrome, Safari and Opera */
        .options-container::-webkit-scrollbar {
            display: none;
        }
        /* Hide scrollbar for IE, Edge and Firefox */
        .options-container {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="bg-white">

<div class="relative">
    <!-- Search Input -->
    <input type="text" id="searchInput" placeholder="Search..." class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
    
    <!-- Options Container -->
    <div id="optionsContainer" class="options-container hidden absolute w-full mt-1 bg-white border border-gray-300 rounded-md shadow-lg max-h-60 overflow-y-auto z-10">
        <!-- Options will be populated here by JavaScript -->
        <div id="loading" class="p-4 text-gray-500">Loading...</div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const searchInput = document.getElementById('searchInput');
        const optionsContainer = document.getElementById('optionsContainer');
        const loadingDiv = document.getElementById('loading');
        
        let allOptions = [];
        let selectedValue = null;
        let settings = {};

        // --- JotForm Widget Communication ---
        JFCustomWidget.subscribe('ready', (widgetData) => {
            // Get settings from JotForm widget settings panel
            settings = widgetData.settings || {};
            
            // The 'dataSourceUrl' is a setting you will create in JotForm
            // It will hold the URL to your JSON data file (e.g., a GitHub Gist URL)
            const dataSourceUrl = settings.dataSourceUrl;

            if (!dataSourceUrl) {
                loadingDiv.textContent = 'Error: Data Source URL not set in widget settings.';
                return;
            }

            // Fetch the data from your API/JSON file
            fetch(dataSourceUrl)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`Network response was not ok: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    allOptions = data;
                    loadingDiv.style.display = 'none';
                    // Initially render all options
                    renderOptions(allOptions); 
                })
                .catch(error => {
                    console.error('Failed to load dropdown options:', error);
                    loadingDiv.textContent = 'Failed to load options.';
                });
        });

        // Function to render the list of options
        function renderOptions(options) {
            optionsContainer.innerHTML = ''; // Clear previous options
            if (options.length === 0) {
                 optionsContainer.innerHTML = '<div class="p-2 text-gray-500">No results found</div>';
            }
            options.forEach(option => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'item p-2 cursor-pointer';
                itemDiv.textContent = option.label;
                itemDiv.dataset.value = option.value;

                if (option.value === selectedValue) {
                    itemDiv.classList.add('selected');
                }

                itemDiv.addEventListener('click', () => {
                    searchInput.value = option.label;
                    selectedValue = option.value;
                    optionsContainer.classList.add('hidden');
                    // Send the selected value back to the JotForm form
                    JFCustomWidget.sendData({ value: selectedValue, valid: true });
                    // Re-render to show selection
                    renderOptions(allOptions.filter(opt => opt.label.toLowerCase().includes(searchInput.value.toLowerCase())));
                });
                optionsContainer.appendChild(itemDiv);
            });
        }

        // Show dropdown on input focus
        searchInput.addEventListener('focus', () => {
            optionsContainer.classList.remove('hidden');
            renderOptions(allOptions);
        });

        // Filter options on input
        searchInput.addEventListener('input', () => {
            const query = searchInput.value.toLowerCase();
            const filteredOptions = allOptions.filter(option => option.label.toLowerCase().includes(query));
            renderOptions(filteredOptions);
            optionsContainer.classList.remove('hidden');
        });

        // Hide dropdown when clicking outside
        document.addEventListener('click', (e) => {
            if (!searchInput.contains(e.target) && !optionsContainer.contains(e.target)) {
                optionsContainer.classList.add('hidden');
            }
        });

        // Send an initial empty but valid state to JotForm
        JFCustomWidget.startup(() => {
            JFCustomWidget.sendData({ valid: true, value: '' });
        });
    });
</script>

</body>
</html>
