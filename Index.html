<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Guided Jotform Tour</title>
  <link rel="stylesheet" href="https://unpkg.com/intro.js/minified/introjs.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f4f4f4;
    }

    #start-tour {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    iframe {
      width: 100%;
      height: 700px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .tour-section {
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

  <button id="start-tour">🚀 Start Guided Tour</button>

  <div class="tour-section" id="form-container"
       data-intro="Welcome! This is where you'll fill in your User Tour form."
       data-step="1">
    <iframe
      id="JotFormIFrame-251518693176061"
      title="User Tour Form"
      onload="window.parent.scrollTo(0,0)"
      allowtransparency="true"
      allow="geolocation; microphone; camera; fullscreen; payment"
      src="https://form.jotform.com/251518693176061"
      frameborder="0"
      style="min-width:100%;max-width:100%;height:700px;border:none;"
      scrolling="no">
    </iframe>
    <script src='https://cdn.jotfor.ms/s/umd/latest/for-form-embed-handler.js'></script>
    <script>
      window.jotformEmbedHandler("iframe[id='JotFormIFrame-251518693176061']", "https://form.jotform.com/");
    </script>
  </div>

  <div class="tour-section" id="submission-tip"
       data-intro="Once completed, your responses are submitted here!"
       data-step="2">
    <p><strong>Note:</strong> Once you complete the form, it will automatically submit and notify our team.</p>
  </div>

  <script src="https://unpkg.com/intro.js/minified/intro.min.js"></script>
  <script>
    document.getElementById('start-tour').addEventListener('click', function () {
      introJs().start();
    });
  </script>
</body>
</html>
